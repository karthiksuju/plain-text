apiVersion: apps/v1
kind: Deployment

metadata:
  name: sample-html

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sample-html

  template:
    metadata:
      labels:
        app: sample-html

    spec:
      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: sample-html
        image: 104818751605.dkr.ecr.ap-south-1.amazonaws.com/sample-html:latest

        ports:
        - containerPort: 80
